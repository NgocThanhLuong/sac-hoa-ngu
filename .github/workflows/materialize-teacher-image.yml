name: Materialize original teacher image

on:
  push:
    branches: [main]
    paths:
      - '.image-upload/READY'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and install original teacher image
        shell: bash
        run: |
          set -euo pipefail
          cat .image-upload/chunk-*.txt | tr -d '\r\n' | base64 --decode > /tmp/tran-anh-van-snow-original.jpg

          test "$(xxd -p -l 2 /tmp/tran-anh-van-snow-original.jpg)" = "ffd8"
          test "$(tail -c 2 /tmp/tran-anh-van-snow-original.jpg | xxd -p)" = "ffd9"
          test "$(wc -c < /tmp/tran-anh-van-snow-original.jpg | tr -d ' ')" = "75237"

          rm -rf assets/teacher public/assets/teacher
          mkdir -p assets/teacher public/assets/teacher data public/data
          cp /tmp/tran-anh-van-snow-original.jpg assets/teacher/tran-anh-van-snow-original.jpg
          cp /tmp/tran-anh-van-snow-original.jpg public/assets/teacher/tran-anh-van-snow-original.jpg

          cat > data/teacher-profile-media.json <<'JSON'
          {
            "schemaVersion": 7,
            "teacherPhoto": {
              "id": "tran-anh-van-snow-original-v7",
              "path": "/assets/teacher/tran-anh-van-snow-original.jpg?v=20260905-7",
              "alt": {
                "vi": "Cô Trần Ánh Vân - giáo viên Sắc Hoa Ngữ",
                "zh": "陈映云老师 - 色华语中文课堂"
              },
              "source": "user_provided_original",
              "confirmedBySiteOwner": true,
              "width": 1152,
              "height": 1536,
              "format": "jpg",
              "qualityNote": "Original JPEG supplied by the site owner. Loaded directly from a normal public asset path; no base64/data URI at runtime."
            }
          }
          JSON
          cp data/teacher-profile-media.json public/data/teacher-profile-media.json

          python3 - <<'PY'
          from pathlib import Path
          for path in [Path('teacher-profile.js'), Path('public/teacher-profile.js')]:
              text = path.read_text(encoding='utf-8')
              import re
              text = re.sub(r"const MEDIA_URL='data/teacher-profile-media\.json\?v=[^']+';", "const MEDIA_URL='data/teacher-profile-media.json?v=20260905-7';", text)
              path.write_text(text, encoding='utf-8')
          for path in [Path('script.js'), Path('public/script.js')]:
              text = path.read_text(encoding='utf-8')
              text = text.replace('teacher-profile.js?v=20260905-6','teacher-profile.js?v=20260905-7')
              text = text.replace('teacher-profile.js?v=20260905-5','teacher-profile.js?v=20260905-7')
              text = text.replace('teacher-profile.js?v=20260826-1','teacher-profile.js?v=20260905-7')
              path.write_text(text, encoding='utf-8')
          PY

          rm -rf .image-upload
          rm -f .github/workflows/materialize-teacher-image.yml

      - name: Commit materialized image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "replace blurred teacher assets with original photo"
          git push origin main
